<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>布大交易教材</title>
<style>
/* ========== 1. 色彩與字體 token ========== */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#faf8f4; --fg:#1d2127; --muted:#5d646d; --faint:#8b9199;
  --line:#e5e1d8; --line2:#d6d1c5;
  --accent:#1e5f8f; --accent-bg:#e8f1f8; --accent-ink:#ffffff;
  --quote-bg:#fbf4e6; --quote-bar:#c58a2a; --quote-ink:#3a2e18;
  --up:#d23a3f; --down:#139463; --up-soft:rgba(210,58,63,.35); --down-soft:rgba(19,148,99,.35);
  --grid:#eeebe4; --chart-bg:#ffffff;
  --ok:#1e5f8f; --wip:#9a5b00; --wip-bg:#fdf0d9;
  --gA:#1e5f8f; --gB:#9a5b00; --gC:#6b7280;
  --fc:#6a46b8; --fc-bg:#efeafb;
  /* 圖上標註(紅綠只留給 K 棒,標註不用紅綠) */
  --an-zone:#b07413; --an-arrow:#0b7885; --an-point:#6a46b8; --an-vline:#6a46b8; --an-line:#a8661a;
  /* 逐步講解的四個角色色(紅綠只留給 K 棒):當時情境 / 他的判斷 / 後來 / 次要細節 */
  --r-ctx:#94600a; --r-judge:#1e5f8f; --r-out:#7044b5; --r-det:#7b828b;
  --shadow:0 1px 2px rgba(20,25,35,.05),0 4px 14px rgba(20,25,35,.05);
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1c1f24; --surface2:#191c20; --fg:#e7e5e0; --muted:#a3a8af; --faint:#7b8189;
    --line:#2b3037; --line2:#373d45;
    --accent:#7db4e0; --accent-bg:#1d2a36; --accent-ink:#0e1a24;
    --quote-bg:#2a2419; --quote-bar:#d7a347; --quote-ink:#efe3c9;
    --up:#f0565c; --down:#2fbf80; --up-soft:rgba(240,86,92,.38); --down-soft:rgba(47,191,128,.38);
    --grid:#262a30; --chart-bg:#1c1f24;
    --ok:#7db4e0; --wip:#e8b25a; --wip-bg:#2c2416;
    --gA:#7db4e0; --gB:#e8b25a; --gC:#9aa0a8;
    --fc:#b9a3f2; --fc-bg:#2a2340;
    --an-zone:#e3b54f; --an-arrow:#4cc7d4; --an-point:#b9a3f2; --an-vline:#b9a3f2; --an-line:#e0a95a;
    --r-ctx:#e3b54f; --r-judge:#7db4e0; --r-out:#b9a3f2; --r-det:#8f959d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f24; --surface2:#191c20; --fg:#e7e5e0; --muted:#a3a8af; --faint:#7b8189;
  --line:#2b3037; --line2:#373d45;
  --accent:#7db4e0; --accent-bg:#1d2a36; --accent-ink:#0e1a24;
  --quote-bg:#2a2419; --quote-bar:#d7a347; --quote-ink:#efe3c9;
  --up:#f0565c; --down:#2fbf80; --up-soft:rgba(240,86,92,.38); --down-soft:rgba(47,191,128,.38);
  --grid:#262a30; --chart-bg:#1c1f24;
  --ok:#7db4e0; --wip:#e8b25a; --wip-bg:#2c2416;
  --gA:#7db4e0; --gB:#e8b25a; --gC:#9aa0a8;
  --fc:#b9a3f2; --fc-bg:#2a2340;
  --an-zone:#e3b54f; --an-arrow:#4cc7d4; --an-point:#b9a3f2; --an-vline:#b9a3f2; --an-line:#e0a95a;
  --r-ctx:#e3b54f; --r-judge:#7db4e0; --r-out:#b9a3f2; --r-det:#8f959d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

/* ========== 2. 基本 ========== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 12px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.85;letter-spacing:.01em;overflow-x:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit}
p{margin:0 0 .9em}
p:last-child{margin-bottom:0}
h1,h2,h3{line-height:1.4;margin:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:6px 10px;z-index:99}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== 3. 頂部列 ========== */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;text-decoration:none;color:var(--fg);white-space:nowrap;margin-right:auto}
.brand small{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.menu-btn{display:none}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;height:40px;border:1px solid var(--line2);border-radius:10px;padding:0 12px 0 36px;background:var(--surface);color:var(--fg);font-size:15px}
.search .s-ico{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint);pointer-events:none}
.search-btn{display:none}
.results{position:absolute;right:0;top:46px;width:min(460px,92vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;font-size:15px;line-height:1.6}
.r-h{font-size:12px;color:var(--faint);padding:8px 10px 4px;letter-spacing:.08em}
.r{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg)}
.r:hover,.r:focus{background:var(--accent-bg)}
.r b{display:block;font-weight:600}
.r span{display:block;color:var(--muted);font-size:14px}
.r mark{background:var(--quote-bg);color:inherit;border-bottom:2px solid var(--quote-bar);padding:0}
.r-empty{padding:14px 10px;color:var(--muted)}

/* ========== 4. 版面 ========== */
.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - var(--top))}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);padding:14px 10px 40px;font-size:15px;line-height:1.5;background:var(--bg)}
.side-home{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;margin-bottom:6px}
.side-home:hover,.side-home.on{background:var(--accent-bg)}
.side-ch{margin:2px 0}
.side-ch-btn{display:flex;width:100%;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg)}
.side-ch-btn:hover{background:var(--surface2)}
.side-ch.on>.side-ch-btn{color:var(--accent)}
.chn{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.side-ch.on .chn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.side-ch.lib .chn{border-color:var(--quote-bar);color:var(--quote-bar)}
.side-ch.lib.on .chn{background:var(--quote-bar);color:#fff}
.side-ch-t{flex:1;min-width:0}
.side-prog{font-size:12px;color:var(--faint);font-weight:400}
.side-secs{list-style:none;margin:2px 0 8px;padding:0 0 0 22px;display:none}
.side-ch.open .side-secs{display:block}
.side-secs a{display:flex;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);border-left:2px solid transparent}
.side-secs a:hover{background:var(--surface2);color:var(--fg)}
.side-secs a.on{background:var(--accent-bg);color:var(--fg);border-left-color:var(--accent);font-weight:600}
.side-secs .sn{flex:none;font-size:12px;color:var(--faint);min-width:28px;padding-top:2px}
.side-secs .dot{margin-left:auto;flex:none;font-size:12px}
.side-secs .dot.read{color:var(--ok)}
.side-secs .dot.wip{color:var(--wip)}
.scrim{display:none}
main{padding:28px 28px 120px;min-width:0}
main:focus{outline:none}
.col{max-width:680px;margin:0 auto}
.col.wide{max-width:760px}
main.loading .col{opacity:.5;transition:opacity .2s}

/* ========== 5. 共用小元件 ========== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;vertical-align:middle;font-weight:600}
.badge:hover{border-color:var(--accent)}
.badge.g-A{color:var(--gA);border-color:color-mix(in srgb,var(--gA) 45%,transparent)}
.badge.g-B{color:var(--gB);border-color:color-mix(in srgb,var(--gB) 45%,transparent)}
.badge.g-C{color:var(--gC)}
.badge.self{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.badge.other{color:var(--fg);border-style:dashed}
.badge.ver::before{content:"✓";font-weight:700}
.badge.wipb{color:var(--wip);background:var(--wip-bg);border-color:transparent}
.kd{display:inline-block;flex:none;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;line-height:1.7;border:0;cursor:pointer;white-space:nowrap}
span.kd{cursor:inherit}
.kd.review{background:var(--accent-bg);color:var(--accent)}
.kd.forecast{background:var(--fc-bg);color:var(--fc)}
.sb{display:inline-block;font-size:10.5px;font-weight:700;line-height:15px;min-width:16px;text-align:center;border-radius:4px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);margin-right:4px;vertical-align:1px;padding:0 1px}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:1.5px dotted var(--accent);line-height:inherit}
.term:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:16px;font-weight:600;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{min-height:54px;font-size:18px;padding:0 26px;border-radius:14px}
.btn.sm{min-height:36px;font-size:14.5px;padding:0 12px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;padding:0 8px}
.cap{font-size:14px;color:var(--muted);line-height:1.6}

/* ========== 6. 首頁 ========== */
.hero{padding:22px 0 8px}
.hero h1{font-size:34px;letter-spacing:.02em}
.hero .lede{font-size:19px;color:var(--muted);margin:10px 0 22px;max-width:30em}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.howto{margin:26px 0 8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px;line-height:1.65}
.howto b{display:block;font-size:16px;margin-bottom:2px}
.stages{list-style:none;padding:0;margin:30px 0 6px;display:flex;flex-wrap:wrap;gap:6px 4px;font-size:14.5px;color:var(--muted);align-items:center}
.stages li{display:flex;align-items:center;gap:4px}
.stages li+li::before{content:"→";color:var(--faint);margin-right:4px}
.stages b{color:var(--fg);font-weight:600}
.stage-h{margin:28px 0 10px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.stage-h::after{content:"";flex:1;height:1px;background:var(--line)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow);min-width:0}
.ch-card:hover{border-color:var(--accent)}
.ch-card .cn{font-size:13px;color:var(--faint);font-weight:600}
.ch-card h3{font-size:19px}
.ch-card p{font-size:15px;line-height:1.65;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.ch-card .meta{margin-top:auto;padding-top:8px;font-size:13px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ch-card.core{border-color:var(--quote-bar);background:linear-gradient(var(--quote-bg),var(--surface) 70%)}
.ch-card.core .cn::after{content:" · 本教材核心";color:var(--quote-bar)}
.legend{margin:34px 0 0;padding:16px 18px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line2);font-size:15px;line-height:1.7}
.legend .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* ========== 7. 章頁 ========== */
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.page-h1{font-size:30px;margin-bottom:10px}
.intro{font-size:18px;color:var(--muted);margin-bottom:22px}
.sec-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.sec-item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--fg)}
.sec-item:hover{border-color:var(--accent)}
.sec-item .num{flex:none;font-weight:700;color:var(--accent);min-width:34px;font-size:16px;padding-top:2px}
.sec-item b{display:block;font-size:17.5px;line-height:1.5}
.sec-item span{display:block;font-size:15px;color:var(--muted);line-height:1.6;margin-top:2px}
.sec-item .st{flex:none;margin-left:auto;font-size:13px;color:var(--faint);white-space:nowrap;padding-top:3px}
.sec-item .st.read{color:var(--ok)}

/* ========== 8. 小節頁 ========== */
.sec-h1{font-size:28px;margin:2px 0 14px}
.conclusion{background:var(--accent-bg);border-radius:16px;padding:16px 20px;margin:0 0 22px}
.conclusion .lab{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;display:block;margin-bottom:2px}
.conclusion p{font-size:19.5px;font-weight:600;line-height:1.7}
.conclusion .meta{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px 22px;margin:0 0 16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-n{flex:none;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);transform:translateY(-2px)}
.card-h h2{font-size:20px}
.card-h .hint{font-size:14px;color:var(--faint)}
.card.is-empty{padding:12px 22px;box-shadow:none;background:transparent;border-style:dashed}
.card.is-empty .card-h{margin:0}
.card.is-empty .card-h h2{font-size:16px;color:var(--muted)}
.card.is-empty .empty{font-size:14.5px;color:var(--faint);margin-left:auto}
.def-lead{font-size:19px;font-weight:600;margin-bottom:12px}
dl.terms{margin:0;display:grid;gap:10px}
dl.terms div{padding:10px 14px;background:var(--surface2);border-radius:10px}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;color:var(--fg)}
/* 引言卡:他的原話 */
.quote{position:relative;margin:0 0 14px;background:var(--quote-bg);border-left:4px solid var(--quote-bar);border-radius:4px 14px 14px 4px;padding:14px 18px 12px;color:var(--quote-ink)}
.quote:last-child{margin-bottom:0}
.q-gist{font-size:13.5px;color:var(--quote-bar);font-weight:700;margin-bottom:4px}
.q-gist::before{content:"這句在說:";font-weight:400;opacity:.85}
.quote blockquote{margin:0;font-size:19px;line-height:1.8;font-weight:500}
.quote blockquote::before{content:"「";margin-left:-.5em}
.quote blockquote::after{content:"」"}
.quote.sm{padding:10px 14px 9px;margin:12px 0 0}
.quote.sm blockquote{font-size:17px}
.q-lab{display:block;font-size:12.5px;font-weight:700;color:var(--quote-bar);letter-spacing:.06em}
.q-top{float:right;margin:0 0 4px 10px;display:inline-flex;align-items:center;gap:4px;line-height:1}
.q-top .badge{font-size:11px;padding:3px 6px}
.fnref{font:inherit;font-size:11px;line-height:1;color:var(--faint);background:none;border:0;padding:2px 1px;cursor:pointer;vertical-align:super;position:relative;top:-.15em}
.fnref:hover{color:var(--accent)}
.q-top .fnref{vertical-align:baseline;top:0;font-size:12px}
.quote::after{content:"";display:block;clear:both}
.other-fold{margin:0 0 14px;border:1px dashed var(--line2);border-radius:12px;padding:8px 14px}
.other-fold summary{cursor:pointer;font-size:15px;color:var(--muted)}
.sub-h{font-size:16px;font-weight:700;margin:20px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sub-h .cap{font-weight:400}
table.tt{width:100%;border-collapse:collapse;font-size:16px;line-height:1.65}
table.tt th{text-align:left;font-size:13px;color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.tt td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tt td.p{white-space:nowrap;font-weight:700;color:var(--accent);width:6.5em}

/* ========== 9. 圖上標註的走勢圖 ========== */
.afig{margin:0 0 22px}
.afig:last-child{margin-bottom:0}
.afig+.afig{padding-top:20px;border-top:1px dashed var(--line2)}
.atop{display:flex;gap:8px;align-items:baseline;margin:0 0 4px}
.ahl{font-size:18.5px;font-weight:700;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.ameta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:0 0 8px}
.ameta b{color:var(--fg)}
.abox{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--chart-bg);overflow:hidden}
.achart{width:100%}
.acv{display:block;width:100%}
.alegend{list-style:none;margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:14.5px;line-height:1.65}
.alegend li{display:flex;gap:6px;align-items:baseline}
.alegend .ln{flex:none;font-weight:700;color:var(--muted);min-width:1.4em}
.asrc{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.6}
.atake{margin:12px 0 0;border-left:4px solid var(--accent);padding:2px 0 2px 12px;font-weight:600;font-size:17px;line-height:1.7}
.atake .lab{display:block;font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
table.acmp{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:14.5px;line-height:1.6}
table.acmp caption{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding-bottom:4px}
table.acmp th{text-align:left;font-size:12.5px;color:var(--faint);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line2)}
table.acmp td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.acmp td:first-child{font-weight:600;white-space:nowrap}
.practice{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--surface2)}
.p-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.p-prompt{font-weight:600;margin-bottom:10px}
.p-opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-size:16.5px;line-height:1.55;display:flex;gap:10px;align-items:baseline}
.opt .k{flex:none;font-weight:700;color:var(--muted)}
.opt.is-his{border-color:var(--accent);background:var(--accent-bg)}
.opt.is-his .k{color:var(--accent)}
.opt .his-tag{flex:none;margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 8px;white-space:nowrap}
.p-fb{margin-top:12px;font-size:16px}
/* 片段 */
.clip{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin:0 0 16px;align-items:start}
.clip:last-child{margin-bottom:0}
.clip-media{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.clip-media video{width:100%;height:100%;display:block;background:#000}
.clip.ph{display:block}
.clip-line{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface2);color:var(--muted);font-size:13.5px;line-height:1.5;min-width:0}
.clip-line svg{flex:none;width:14px;height:14px;opacity:.55}
.clip-line span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip.ph .clip-info{margin-top:6px}
.clip-info{font-size:15.5px;line-height:1.7}
.clip-info .why{font-weight:600;margin-bottom:6px}
.clip-info .why::before{content:"為什麼看這段:";display:block;font-size:12.5px;color:var(--faint);font-weight:600;letter-spacing:.05em}
/* 誤解 */
.myth{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.myth:last-child{margin-bottom:0}
.myth-row{display:grid;grid-template-columns:1fr 1fr}
.myth-row>div{padding:12px 14px}
.myth-w{background:var(--surface2)}
.myth-r{background:var(--accent-bg)}
.mk{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em}
.myth-w .mk{color:var(--muted)}
.myth-r .mk{color:var(--accent)}
.myth-q{padding:10px 14px 12px;font-size:15.5px;line-height:1.7;color:var(--quote-ink);background:var(--quote-bg);border-top:1px solid var(--line)}
.myth-q q{quotes:"「" "」"}
/* 自我檢查 */
.checks{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.checks li{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.checks .q{padding:11px 14px;font-weight:600;line-height:1.6;background:var(--surface2)}
.checks .qn{color:var(--accent);margin-right:8px}
.checks .a{padding:10px 14px 12px 38px;background:var(--accent-bg);line-height:1.75;position:relative}
.checks .a::before{content:"答";position:absolute;left:14px;top:11px;font-size:12px;font-weight:700;color:var(--accent);line-height:1.9}
.checks .a p{margin:0}
.rel{margin:22px 0 0}
.rel h2{font-size:15px;color:var(--muted);margin-bottom:6px}
.rel a{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--fg);font-size:15.5px;line-height:1.55;margin-bottom:6px}
.rel a:hover{border-color:var(--accent)}
/* 出處註腳 */
.fns{margin:26px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.6;color:var(--faint)}
.fns h2{font-size:11.5px;font-weight:600;margin:0 0 4px;letter-spacing:.06em;color:var(--faint)}
.fns ol{list-style:none;margin:0;padding:0}
.fns li{display:flex;gap:6px;margin:0 0 2px;scroll-margin-top:calc(var(--top) + 60px);overflow-wrap:anywhere}
.fns li.flash{background:var(--quote-bg);color:var(--fg)}
.fns .fn-n{flex:none;min-width:1.6em}
.fns .fn-back{font:inherit;font-size:11px;border:0;background:none;color:var(--faint);cursor:pointer;padding:0 2px;text-decoration:underline}
.ct-body .fns{margin-top:14px}
/* 節尾 */
.notes{margin:22px 0 0;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.notes summary{cursor:pointer}
.notes p{margin-top:8px;line-height:1.7}
.wip-box{background:var(--wip-bg);color:var(--wip);border-radius:14px;padding:14px 18px;margin:0 0 18px;font-weight:600}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.pg{display:block;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.5;min-width:0}
.pg:hover{border-color:var(--accent)}
.pg b{display:block;color:var(--fg);font-size:16px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.next{text-align:right}
.pg.none{visibility:hidden}
.sec-end{height:1px}

/* ========== 10. 走勢案例庫 ========== */
.lib-sum{font-size:14.5px;color:var(--muted);margin:-10px 0 14px}
.lib-bar{position:sticky;top:var(--top);z-index:20;background:var(--bg);padding:10px 0 8px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.lib-r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib-q{position:relative;flex:1 1 220px;min-width:0}
.lib-q input{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 12px 0 36px;background:var(--surface);color:var(--fg);font-size:15.5px}
.lib-q svg{position:absolute;left:11px;top:12px;width:18px;height:18px;color:var(--faint);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;height:40px;padding:0 13px;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.lib-r2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lib-r2 select{height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--fg);font-size:15px;padding:0 8px;max-width:100%;flex:1 1 140px;min-width:0}
.lib-r2 select.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.lib-tog{display:none}
.lib-status{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:14px;color:var(--muted);margin:8px 0 10px}
.lib-status b{color:var(--fg)}
.lib-status .btn{min-height:32px}
.lib-yr{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 8px;letter-spacing:.04em}
.lib-yr::after{content:"";flex:1;height:1px;background:var(--line)}
.lib-yr span{font-weight:400;color:var(--faint)}
.lib-wait{padding:18px 0;color:var(--muted);font-size:15px;visibility:hidden}
.lib-wait.show{visibility:visible}
.lib-next{display:flex;justify-content:center;margin:14px 0 0}
.lib-empty{padding:22px 16px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
.ct{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;box-shadow:var(--shadow);content-visibility:auto;contain-intrinsic-size:auto 122px;scroll-margin-top:calc(var(--top) + 120px)}
.ct.open{content-visibility:visible;border-color:var(--line2)}
.ct-head{display:flex;gap:14px;width:100%;text-align:left;border:0;background:none;padding:12px;cursor:pointer;align-items:center;border-radius:14px;color:var(--fg)}
.ct-head:hover .ct-hl{color:var(--accent)}
.ct-thumb{flex:none;width:168px;height:96px;border-radius:8px;background:var(--chart-bg);border:1px solid var(--line);display:block}
.ct-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.ct-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;line-height:1.5}
.ct-hl{font-size:17px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct-tags{font-size:12.5px;color:var(--faint);line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ct-chev{flex:none;width:20px;height:20px;color:var(--faint);transition:transform .15s}
.ct.open .ct-chev{transform:rotate(180deg)}
.ct-body{padding:4px 18px 16px;border-top:1px solid var(--line)}
.ct-body .afig{margin-top:12px}
.ct-wait{height:300px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--faint);font-size:14px;margin-top:12px}
.ct-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tagchip{display:inline-block;font-size:13.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);text-decoration:none;color:var(--muted);background:var(--surface)}
.tagchip:hover{border-color:var(--accent);color:var(--accent)}
.ct-foot .grow{flex:1}

/* ========== 11. 浮出說明 ========== */
.pop{position:fixed;z-index:60;max-width:340px;background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 40px 14px 16px;font-size:15.5px;line-height:1.7}
.pop-t{font-weight:700;font-size:16.5px;margin-bottom:2px}
.pop a{font-size:14px}
.pop-x{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:20px;color:var(--muted);border-radius:8px}
.pop.sheet{left:0!important;right:0;bottom:0;top:auto!important;max-width:none;border-radius:18px 18px 0 0;padding:18px 48px calc(18px + env(safe-area-inset-bottom)) 20px}

/* ========== 12. 手機 ========== */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-grid}
  .side{position:fixed;left:0;top:var(--top);bottom:0;height:auto;width:min(86vw,340px);z-index:40;transform:translateX(-102%);transition:transform .22s ease;background:var(--surface);box-shadow:var(--shadow)}
  body.drawer-open .side{transform:none}
  body.drawer-open .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  main{padding:20px 16px 100px}
}
@media (max-width:640px){
  body{font-size:17px}
  .brand small{display:none}
  .search{display:none;position:absolute;left:8px;right:8px;width:auto;top:8px}
  .top.searching .search{display:block}
  .top.searching .brand,.top.searching .menu-btn,.top.searching #themeBtn{visibility:hidden}
  .search-btn{display:inline-grid}
  .results{left:0;right:0;width:auto}
  .hero h1{font-size:28px}
  .hero .lede{font-size:17.5px}
  .howto{grid-template-columns:1fr}
  .sec-h1{font-size:24px}
  .page-h1{font-size:25px}
  .conclusion{padding:14px 16px}
  .conclusion p{font-size:18px}
  .card{padding:16px 16px 18px;border-radius:16px}
  .card.is-empty{padding:10px 16px}
  .card.is-empty .card-h{flex-wrap:wrap}
  .card.is-empty .empty{margin-left:0;width:100%}
  .card-h .hint{display:none}
  .quote{padding:12px 14px}
  .quote blockquote{font-size:17.5px}
  .clip{grid-template-columns:1fr}
  .myth-row{grid-template-columns:1fr}
  table.tt,table.tt tbody,table.tt tr,table.tt td{display:block;width:auto!important}
  table.tt thead{display:none}
  table.tt tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.tt td{border:0;padding:0}
  table.acmp,table.acmp tbody,table.acmp tr,table.acmp td{display:block;width:auto}
  table.acmp thead{display:none}
  table.acmp tr{padding:6px 0;border-bottom:1px solid var(--line)}
  table.acmp td{border:0;padding:0}
  table.acmp td:nth-child(2)::before{content:"他說:";color:var(--faint)}
  table.acmp td:nth-child(3)::before{content:"K 線值:";color:var(--faint)}
  .pager{grid-template-columns:1fr}
  .pg.next{text-align:left}
  .pg.none{display:none}
  /* 圖貼齊卡片左右邊,手機多出 32px 給標註 */
  .card .abox,.ct-body .abox{margin:0 -16px;border-radius:0;border-left:0;border-right:0}
  .ahl{font-size:17px}
  .lib-bar{padding:8px 0 6px}
  .lib-r1 .seg button{padding:0 10px;font-size:14.5px}
  .lib-tog{display:inline-flex}
  .lib-r2{display:none}
  .lib-bar.open .lib-r2{display:flex}
  .lib-r2 select{flex:1 1 calc(50% - 4px)}
  .lib-sort-wide{display:none}
  .ct-head{gap:10px;padding:10px}
  .ct-thumb{width:112px;height:72px}
  .ct-hl{font-size:16px}
  .ct-body{padding:2px 16px 14px}
}
/* ========== 13. 寬螢幕(≥901 / ≥1280 / ≥1440 / ≥1700),見 DESIGN_NOTES_v3_wide.md ========== */
.sec-guide{display:none}
@media (min-width:901px) and (max-width:1699px){
  .layout{grid-template-columns:256px minmax(0,1fr)}
}
@media (min-width:1280px){
  main{padding:28px 24px 120px}
  .col.sec{max-width:720px}
  .col.home,.col.chap,.col.lib,.col.case{max-width:1300px}
  /* 首頁:開場文字左、三則「怎麼讀」右 */
  .home-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center}
  .home-top .hero{padding-bottom:22px}
  .home-top .howto{margin:0;grid-template-columns:1fr;gap:8px}
  .home-top .howto div{padding:12px 16px}
  .ch-grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  /* 章頁:小節兩欄 */
  .col.chap .intro{max-width:42em}
  .col.chap .sec-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 案例庫:卡片網格(2~3 欄);年份列、空狀態、展開內容(放在該列之後)佔整列 */
  #libList{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  #libList>.lib-yr,#libList>.lib-empty,#libList>.ct-body{grid-column:1/-1}
  #libList>.lib-yr{margin:12px 0 0}
  #libList>.ct{margin:0;contain-intrinsic-size:auto 280px}
  #libList>.ct .ct-head{flex-direction:column;align-items:stretch;gap:10px;padding:10px 10px 14px}
  #libList>.ct .ct-thumb{width:100%;height:160px}
  #libList>.ct .ct-txt{padding:0 4px}
  #libList>.ct .ct-chev{display:none}
  #libList>.ct.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  #libList>.ct-body{background:var(--surface);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:6px 22px 18px;scroll-margin-top:calc(var(--top) + 120px)}
  /* 案例:左圖右說明 */
  .afig.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);column-gap:28px;align-items:start}
  .afig.split>.atop{grid-column:1/-1}
  .afig.split>.af-r{padding-top:40px}
  .afig.split>.af-r>:first-child{margin-top:0}
  .afig.split .alegend{margin-top:10px}
  .ct-body{padding:4px 20px 18px}
  /* 首頁:階段區塊兩兩並排 */
  .stage-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));column-gap:32px}
  .stage-wrap .ch-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
}
@media (min-width:1440px){
  /* 小節:左閱讀欄(≤680)+ 右證據欄(走勢圖卡或本節重點卡,黏住) */
  .col.sec{max-width:1300px}
  .col.sec>article{display:grid;grid-template-columns:minmax(0,680px) minmax(540px,1fr);column-gap:28px;align-items:start}
  .col.sec>article>*{grid-column:1;min-width:0}
  .col.sec>article>.figcard,.col.sec>article>.sec-guide{grid-column:2;grid-row:1 / span 60;position:sticky;top:calc(var(--top) + 16px);max-height:calc(100vh - var(--top) - 32px);overflow-y:auto;scrollbar-width:thin;margin:0}
  .col.sec>.pager{max-width:680px}
  .figcard{padding:16px 16px 18px}
  .figcard .abox{margin:0 -16px;border-radius:0;border-left:0;border-right:0}
  .figcard .card-h{margin-bottom:8px}
  .sec-guide{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.65}
  .g-lab{display:block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}
  .g-conc{font-size:17px;font-weight:600;line-height:1.7;margin:4px 0 0}
  .g-h{font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  .g-q{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .g-q a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:7px 12px;border-left:3px solid var(--quote-bar);border-radius:3px 10px 10px 3px;background:var(--quote-bg);color:var(--quote-ink);text-decoration:none;font-size:15px;line-height:1.6}
  .g-q a::before{content:"「"}
  .g-q a:hover{filter:brightness(.97)}
  .g-toc{list-style:none;margin:0;padding:0}
  .g-toc a{display:flex;gap:10px;align-items:baseline;padding:5px 8px;border-radius:8px;color:var(--fg);text-decoration:none}
  .g-toc a:hover{background:var(--surface2);color:var(--accent)}
  .g-toc span{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);transform:translateY(-1px)}
}
@media (min-width:1700px){
  .layout{grid-template-columns:296px minmax(0,1fr)}
  main{padding:32px 32px 120px}
  .col.sec>article{column-gap:48px}
}
/* ========== 14. 走勢圖逐步講解 + 重點 + 標註清單,見 DESIGN_NOTES_v3_tiered.md ========== */
.r-ctx{--rc:var(--r-ctx)} .r-judge{--rc:var(--r-judge)} .r-out{--rc:var(--r-out)} .r-all,.r-det{--rc:var(--r-det)}
.stp{margin:0 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.stp-top{display:flex;align-items:center;gap:6px 8px;padding:8px 10px 0;flex-wrap:wrap}
.stp-dots{display:flex;gap:4px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.sd{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:3px 11px 3px 4px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;line-height:1.3;cursor:pointer;white-space:nowrap}
.sd b{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12.5px;border:1.5px solid var(--rc);color:var(--rc);background:var(--surface)}
.sd:hover{border-color:var(--rc)}
.sd[aria-current="step"]{color:var(--fg);font-weight:700;border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.sd[aria-current="step"] b,.sd.seen b{background:var(--rc);color:var(--surface)}
.stp-allbtn{flex:none;border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px;min-height:34px;text-decoration:underline;text-underline-offset:3px}
.stp-card{display:flex;gap:12px;align-items:center;padding:8px 10px 10px 12px}
.stp-txt{flex:1;min-width:0;border-left:4px solid var(--rc);padding:1px 0 1px 11px}
.stp-t{display:block;font-size:12.5px;font-weight:700;color:var(--rc);letter-spacing:.05em}
.stp-t span{font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.stp-txt p{margin:0;font-size:17px;line-height:1.6;font-weight:600}
.stp-txt p+p{margin-top:4px}
.stp-pre{color:var(--rc);margin-right:6px}
.stp-note{font-size:15px!important;font-weight:400!important;color:var(--muted)}
.stp-q{font-size:15.5px!important;font-weight:500!important;color:var(--quote-ink);background:var(--quote-bg);border-radius:6px;padding:3px 8px;display:inline-block}
.stp-q i{font-style:normal;font-size:12px;font-weight:700;color:var(--quote-bar);margin-right:6px}
.chip{display:inline-block;font-size:13px;font-weight:600;line-height:1.5;padding:1px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);vertical-align:1px;white-space:nowrap}
.stp-nav{flex:none;display:flex;gap:6px}
.stp-nav .btn{min-height:40px;padding:0 14px;font-size:15px}
.stp-nav .btn[disabled]{opacity:.4;cursor:default}
.abox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 圖下:重點(結論先行)與標註清單 */
.afig .atake{margin:12px 0 0;border-left:0;padding:12px 16px;border-radius:12px;background:var(--accent-bg);font-size:18.5px;line-height:1.65}
.afig .atake .lab{font-size:12.5px}
.aout{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.adet-h{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:14px 0 4px}
.adet-h span{font-weight:400;letter-spacing:0}
.adet{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.55;border-top:1px solid var(--line)}
.adet li{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-bottom:1px solid var(--line);transition:opacity .15s}
.adet li[data-k]{cursor:pointer}
.adet li.hl{background:var(--accent-bg)}
.adet li.later{opacity:.5}
.adet .dn{flex:none;min-width:1.6em;font-weight:700;color:var(--rc)}
.adet .dtx{flex:1;min-width:0;overflow-wrap:anywhere}
.adet .dtx b{color:var(--rc);margin-right:4px}
.adet .dpx{flex:none;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.adet .sb{flex:none;margin:0}
.adet-src{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.6}
@media (max-width:640px){
  .stp{margin:0 -16px 8px;border-radius:0;border-left:0;border-right:0}
  .stp-top{padding:8px 12px 0}
  .sd{padding:0;min-width:40px;min-height:40px;justify-content:center}
  .sd b{width:30px;height:30px;font-size:13.5px}
  .sd span{display:none}
  .stp-card{flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px 10px}
  .stp-txt p{font-size:16px}
  .stp-nav .btn{flex:1;min-height:46px;font-size:16px}
  .afig .atake{font-size:17.5px;padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.side,.pager,.lib-bar{display:none}.layout{display:block}.card{box-shadow:none;break-inside:avoid}}

<body>

<header class="top" id="top">
  <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="開啟目錄" aria-expanded="false" aria-controls="side">

</div>
<div class="pop" id="pop" role="dialog" aria-modal="false" hidden></div>

<script>
/* ============================================================
   布大交易教材 — 模板 v3(不含資料)
   資料入口:loadIndex() / loadSection(id) / loadCaseIndex() / loadCase(id)
   預覽:讀 window.__B_DATA__;正式版:在本 script 之前定義
         window.__B_LOADER__ = { loadIndex, loadSection, loadCaseIndex, loadCase }
   見 DESIGN_NOTES_v3.md §5
   ============================================================ */
(function () {
  'use strict';

  /* ---------- 設定 ---------- */
  var CFG = {
    practiceChapters: [5, 6],   /* 情境題只在這些章(章 id,不是顯示編號) */
    charsPerMin: 300,
    storeKey: 'bteach.v1',      /* 沿用 v1/v2 的已讀紀錄 */
    batch: 12,                  /* 案例庫一次渲染幾張 */
    caseCache: 40,              /* 單案資料最多留幾筆在記憶體 */
    maxCharts: 2, maxClips: 2, maxQuotes: 3
  };
  var DEFAULT_ORDER = [0, 1, 9, 8, 2, 3, 4, 5, 6, 7, 10];
  var DEFAULT_STAGES = [
    { name: '打底觀念', ch: [0, 1] },
    { name: '心態與市場觀', ch: [9, 8] },
    { name: '看懂 K 棒與趨勢', ch: [2, 3] },
    { name: '選標的與進場', ch: [4, 5] },
    { name: '出場與倉位', ch: [6, 7] },
    { name: '看他實戰', ch: [10] }
  ];
  var TF_LABEL = { '1m': '1 分鐘 K', '5m': '5 分鐘 K', '15m': '15 分鐘 K', '30m': '30 分鐘 K', '1h': '1 小時 K', '2h': '2 小時 K', '4h': '4 小時 K', '8h': '8 小時 K', '12h': '12 小時 K', '1d': '日 K', '1w': '週 K' };
  var TF_ORDER = ['1m', '5m', '15m', '30m', '1h', '2h', '4h', '8h', '12h', '1d', '1w'];
  var KIND = { review: '覆盤', forecast: '預測' };
  var SRC = { '口述': ['述', '他口述'], '畫面': ['畫', '他畫面上的標記'], '資料': ['資', '由 K 線資料對出'] };
  var HELP = {
    A: ['A 級:口述價位對得上', '他親口說出的時間、價位和真實 K 線對得上。圖上的數字可以直接參考。'],
    B: ['B 級:畫面估算', '位置是從他影片畫面讀出來的估計值,可能有些誤差。'],
    C: ['C 級:示意', '價位沒有對上,只用來看形狀與先後順序,圖上不印價格。'],
    self: ['本人', '這句話是他本人在影片裡說的。'],
    other: ['非本人', '不是他本人說的(例如學員或 AI 摘要)。教材不把它當成他的說法,所以預設收起來。'],
    utc: ['時間都是 UTC', 'K 線時間用 UTC(台灣時間要再加 8 小時)。他口述的日期多半是台灣時間,前後可能差半天。'],
    annot: ['圖怎麼看', '按「下一步」一步一步看:先看他當時看到的(決策線左邊)→ 他的判斷 → 後來實際怎麼走 → 最後一步畫出全部標註;也可以按「一次顯示全部」。顏色:琥珀色 = 他當時看到的區域與 K 棒;藍色 = 他的判斷與價位(藍色虛線是他做決定的位置);紫色 = 後來;灰色編號 = 次要細節。完整文字在圖下的「標註清單」,滑過或點一下,圖和清單會互相標出。清單裡的小方塊是來源:述 = 他口述、畫 = 他畫面上的標記、資 = 由 K 線資料對出。'],
    review: ['覆盤', '事後回頭講解一段已經走完的走勢。'],
    forecast: ['預測', '他在當下(還沒走完時)講的看法;藍色虛線右邊是後來實際的走勢。'],
    nodate: ['時期不明', '這段影片沒有可靠的錄製日期。'],
    wip: ['撰寫中', '這一節還在整理,目前只放標題與要講的概念,內容之後補上。']
  };

  /* ---------- 小工具 ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function isArr(x) { return Array.isArray(x); }
  function arr(x) { return isArr(x) ? x : []; }
  function num(x) { return typeof x === 'number' && isFinite(x); }
  var UID = 0;
  function uid() { UID += 1; return 'u' + UID; }
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
  var idle = window.requestIdleCallback ? function (f) { window.requestIdleCallback(f, { timeout: 1500 }); } : function (f) { setTimeout(f, 300); };

  /* ---------- 儲存 ---------- */
  var Store = (function () {
    var mem = {};
    try {
      var raw = window.localStorage.getItem(CFG.storeKey);
      if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') mem = o; }
    } catch (e) { mem = {}; }
    function save() { try { window.localStorage.setItem(CFG.storeKey, JSON.stringify(mem)); } catch (e) { /* 私密模式:只存記憶體 */ } }
    return {
      get: function (k, d) { return mem[k] === undefined ? d : mem[k]; },
      set: function (k, v) { mem[k] = v; save(); },
      bucket: function (k) { if (!mem[k] || typeof mem[k] !== 'object') mem[k] = {}; return mem[k]; },
      save: save
    };
  })();

  /* ============================================================
     資料入口(唯一會碰資料來源的地方)
     ============================================================ */
  var PreviewLoader = {
    data: function () {
      var d = window.__B_DATA__;
      if (!d || typeof d !== 'object') throw new Error('NO_DATA');
      return d;
    },
    loadIndex: function () {
      var self = this;
      return Promise.resolve().then(function () {
        var d = self.data();
        return { generated: d.generated, glossary: arr(d.glossary), chapters: arr(d.chapters), order: d.order, stages: d.stages, search: buildSearchDocs(d) };
      });
    },
    loadSection: function (id) {
      var self = this;
      return Promise.resolve().then(function () {
        var d = self.data(), s = (d.sections || {})[id];
        if (!s) return null;
        var kl = {}, src = {};
        collectRefs(s, d.klines || {}, d.sources || {}, kl, src);
        chartKeys(s).forEach(function (k) {
          var it = (d.klines || {})[k];
          if (it) { kl[k] = it; var c = it.clip_id || it.recon_clip; if (c && d.sources && d.sources[c]) src[c] = d.sources[c]; }
        });
        return { section: s, klines: kl, sources: src };
      });
    },
    loadCaseIndex: function () {
      var self = this;
      return Promise.resolve().then(function () {
        var d = self.data();
        if (d.case_index && isArr(d.case_index.cases)) return d.case_index;
        var cs = d.cases || {};
        return { cases: Object.keys(cs).map(function (id) { var c = cs[id]; return { id: c.id || id, symbol: c.symbol, timeframe: c.timeframe, date: c.date, kind: c.kind, headline: c.headline, tags: c.tags, grade: c.grade }; }) };
      });
    },
    loadCase: function (id) {
      var self = this;
      return Promise.resolve().then(function () { return (self.data().cases || {})[id] || null; });
    }
  };
  function chartKeys(s) {
    if (s && isArr(s.chart_keys)) return s.chart_keys;
    return s && s.kline_key ? [s.kline_key] : [];
  }
  function collectRefs(o, K, S, kl, src) {
    if (isArr(o)) { for (var i = 0; i < o.length; i++) collectRefs(o[i], K, S, kl, src); return; }
    if (!o || typeof o !== 'object') return;
    for (var k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      var v = o[k];
      if (typeof v === 'string') {
        if (k === 'kline_key' && K[v]) kl[v] = K[v];
        if ((k === 'src' || k === 'clip_id' || k === 'case_clip') && S[v]) src[v] = S[v];
      } else collectRefs(v, K, S, kl, src);
    }
  }
  function buildSearchDocs(d) {
    var docs = [], secs = d.sections || {};
    arr(d.chapters).forEach(function (c) {
      arr(c.sections).forEach(function (s) {
        var full = secs[s.id];
        docs.push({ type: 'sec', id: s.id, title: s.title, text: [s.concept, full && full.definition].filter(Boolean).join(' ') });
      });
    });
    Object.keys(secs).forEach(function (id) {
      arr(secs[id].his_words).forEach(function (h, i) { docs.push({ type: 'quote', id: id, title: secs[id].title, text: h.quote || '', anchor: 'q' + i }); });
    });
    arr(d.glossary).forEach(function (g) { docs.push({ type: 'term', id: 'ch00_s5', title: g.term, text: g.meaning || '' }); });
    return docs;
  }
  function getAPI() {
    var L = window.__B_LOADER__;
    return (L && typeof L.loadIndex === 'function' && typeof L.loadSection === 'function') ? L : PreviewLoader;
  }
  function caseAPI() {
    var L = getAPI();
    return (typeof L.loadCaseIndex === 'function' && typeof L.loadCase === 'function') ? L : null;
  }
  /** @returns {Promise<{generated, glossary, chapters, order?, stages?, search?}>} */
  function loadIndex() { return Promise.resolve(getAPI().loadIndex()); }
  /** @returns {Promise<{section, klines, sources} | null>} */
  function loadSection(id) { return Promise.resolve(getAPI().loadSection(id)); }
  /** @returns {Promise<{cases:[CaseIndexRow]}>} */
  function loadCaseIndex() { var A = caseAPI(); return A ? Promise.resolve(A.loadCaseIndex()) : Promise.reject(new Error('NO_CASES')); }
  /** @returns {Promise<Case | null>} */
  function loadCase(id) { var A = caseAPI(); return A ? Promise.resolve(A.loadCase(id)) : Promise.reject(new Error('NO_CASES')); }

  /* ============================================================
     路由:# 後面 key=value&…;保留 k(正式版金鑰)
     s=小節 c=章 a=錨點 cs=單一案例;案例庫篩選:q kd y sym tf tag o x
     ============================================================ */
  function parseHash() {
    var out = {}, h = location.hash.replace(/^#\/?/, '');
    if (!h) return out;
    h.split('&').forEach(function (part) {
      if (!part) return;
      var i = part.indexOf('=');
      var k = i < 0 ? part : part.slice(0, i), v = i < 0 ? '' : part.slice(i + 1);
      try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { out[k] = v; }
    });
    return out;
  }
  function linkTo(p) {
    var cur = parseHash(), parts = [];
    if (cur.k) parts.push('k=' + encodeURIComponent(cur.k));
    Object.keys(p || {}).forEach(function (k) {
      if (p[k] != null && p[k] !== '') parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(p[k]));
    });
    return '#' + parts.join('&');
  }
  /* 改網址但不重繪(篩選、展開案例用) */
  function setHashQuiet(p) {
    try { history.replaceState(history.state, '', linkTo(p)); } catch (e) { /* file:// 某些瀏覽器不允許:只是網址不更新 */ }
  }

  /* ============================================================
     狀態
     ============================================================ */
  var IDX = null, CHS = [], CHN = {}, FLAT = [], POS = {}, TERMS = [], SEARCH = [], STAGES = DEFAULT_STAGES;
  var CUR = { sources: {}, mounts: [] };
  var renderToken = 0, endObserver = null;
  var main, side, pop;

  function prep() {
    var byN = {};
    IDX.chapters.forEach(function (c) { byN[c.n] = c; });
    var order = isArr(IDX.order) && IDX.order.length ? IDX.order : (IDX.chapters.length === 11 ? DEFAULT_ORDER : IDX.chapters.map(function (c) { return c.n; }));
    CHS = []; CHN = {};
    order.forEach(function (n) { if (byN[n] && !CHN[n]) { CHS.push(byN[n]); CHN[n] = byN[n]; } });
    IDX.chapters.forEach(function (c) { if (!CHN[c.n]) { CHS.push(c); CHN[c.n] = c; } });
    CHS.forEach(function (c, i) { c._dn = num(c.display_no) ? c.display_no : i; c._lib = c.kind === 'cases'; });
    FLAT = []; POS = {};
    CHS.forEach(function (c) {
      if (c._lib) { FLAT.push({ id: '@lib' + c.n, lib: true, ch: c.n, num: String(c._dn), outline: { title: c.title }, chapter: c }); return; }
      arr(c.sections).forEach(function (s, i) {
        var item = { id: s.id, ch: c.n, idx: i, num: c._dn + '-' + (i + 1), outline: s, chapter: c };
        POS[s.id] = item; FLAT.push(item);
      });
    });
    FLAT.forEach(function (it, i) { it.flat = i; });
    STAGES = isArr(IDX.stages) && IDX.stages.length ? IDX.stages : DEFAULT_STAGES;
    TERMS = buildTerms(IDX.glossary);
    SEARCH = arr(IDX.search);
  }
  function libChapter() { for (var i = 0; i < CHS.length; i++) if (CHS[i]._lib) return CHS[i]; return null; }
  function itemHref(it) { return it.lib ? linkTo({ c: it.ch }) : linkTo({ s: it.id }); }

  /* ---------- 詞彙:每節第一次出現可點 ---------- */
  function buildTerms(gl) {
    var out = [];
    gl.forEach(function (g, gi) {
      String(g.term || '').split(/[\/／、]/).forEach(function (a) {
        a = a.replace(/[((][^))]*[))]/g, '').trim();
        if (a.length >= 2) out.push({ a: a, gi: gi });
      });
    });
    out.sort(function (x, y) { return y.a.length - x.a.length; });
    return out;
  }
  function lt(text, ctx) {
    text = String(text == null ? '' : text);
    if (!ctx || !TERMS.length) return esc(text);
    var out = '', buf = '', i = 0;
    while (i < text.length) {
      var hit = null;
      for (var t = 0; t < TERMS.length; t++) {
        var al = TERMS[t];
        if (!ctx.used[al.gi] && text.charCodeAt(i) === al.a.charCodeAt(0) && text.substr(i, al.a.length) === al.a) { hit = al; break; }
      }
      if (hit) {
        out += esc(buf); buf = '';
        out += '<button type="button" class="term" data-g="' + hit.gi + '">' + esc(hit.a) + '</button>';
        ctx.used[hit.gi] = true; i += hit.a.length;
      } else { buf += text.charAt(i); i += 1; }
    }
    return out + esc(buf);
  }
  function paras(text, ctx) {
    return String(text || '').split(/\n\s*\n/).map(function (b) { return b.trim(); }).filter(Boolean).map(function (b) {
      return '<p>' + b.split('\n').map(function (line) { return lt(line, ctx); }).join('<br>') + '</p>';
    }).join('');
  }
  function explainHTML(text, ctx) {
    var lines = String(text || '').split(/\n+/).map(function (l) { return l.trim(); }).filter(Boolean);
    var re = /^([^:：。,，]{1,16})[:：](.+)$/;
    var hits = lines.filter(function (l) { return re.test(l); });
    if (hits.length >= 4 && hits.length >= lines.length * 0.7) {
      return '<dl class="terms">' + lines.map(function (l) {
        var m = l.match(re);
        return m ? '<div><dt>' + lt(m[1], ctx) + '</dt><dd>' + lt(m[2], ctx) + '</dd></div>' : '<div><dd>' + lt(l, ctx) + '</dd></div>';
      }).join('') + '</dl>';
    }
    return paras(text, ctx);
  }
  function newCtx(pfx, sources) { return { used: {}, fn: [], fnMap: {}, pfx: pfx || '', sources: sources || null }; }

  /* ---------- 來源、標記 ---------- */
  function srcOf(id, ctx) { return (ctx && ctx.sources && ctx.sources[id]) || CUR.sources[id] || null; }

  /* ---------- 縮圖(案例庫):索引裡的壓縮 K 棒,沒有就由完整資料算 ---------- */
  var B64 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';

    if (!t || typeof t.b !== 'string' || t.b.length < 16) return null;
    var s = t.b, rows = [], i;
    function v(p) { return B64.indexOf(s.charAt(p)) * 64 + B64.indexOf(s.charAt(p + 1)); }

    return { rows: rows, d: num(t.d) ? t.d : rows.length - 1, m: arr(t.m) };
  }
  /* 參考實作:組裝端請用同一演算法預先算好放進索引(DESIGN_NOTES_v3 §5.4) */
  function thumbFromBars(bars, an, maxn) {
    maxn = maxn || 48;
    var n = bars.length, k = Math.max(1, Math.ceil(n / maxn)), g = [], s, j;
    for (s = 0; s < n; s += k) {
      var grp = bars.slice(s, s + k), h = -Infinity, l = Infinity;
      for (j = 0; j < grp.length; j++) { h = Math.max(h, grp[j][2]); l = Math.min(l, grp[j][3]); }
      g.push([grp[0][1], h, l, grp[grp.length - 1][4]]);

    g.forEach(function (r) { lo = Math.min(lo, r[2]); hi = Math.max(hi, r[1]); });
    var sp = (hi - lo) || 1, out = '';
    function enc(x) { var v = clamp(Math.round((x - lo) / sp * 4095), 0, 4095); return B64.charAt(v >> 6) + B64.charAt(v & 63); }
    g.forEach(function (r) { out += enc(r[0]) + enc(r[1]) + enc(r[2]) + enc(r[3]); });
    var m = [];
    annList(an).forEach(function (a) {
      var i0 = Math.floor(a.i0 / k), i1 = Math.floor((num(a.i1) ? a.i1 : a.i0) / k);
      if (a.type === 'zone') m.push(['z', i0, i1]); else if (a.type === 'arrow') m.push(['a', i0, i1]);
      else if (a.type === 'point') m.push(['p', i0]); else if (a.type === 'vline') m.push(['v', i0]);

  }
  function drawThumb(cv, thumb) {
    var T = thumbDecode(thumb);
    var W = cv.clientWidth, H = cv.clientHeight;
    if (!T || W < 10) return false;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var g = cv.getContext('2d'), C = colors(); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var R = T.rows, n = R.length, x0 = 3, x1 = W - 3, y0 = 5, y1 = H - 5, slot = (x1 - x0) / n, bw = Math.max(1, slot * 0.62);
    function X(i) { return x0 + (clamp(i, 0, n - 1) + 0.5) * slot; }
    function Y(v) { return y1 - v / 4095 * (y1 - y0); }
    function ext(i0, i1) { var l = 4095, h = 0; for (var i = clamp(i0, 0, n - 1); i <= clamp(i1, 0, n - 1); i++) { l = Math.min(l, R[i][2]); h = Math.max(h, R[i][1]); } return [l, h]; }
    /* 縮圖只留兩樣:決策線(藍虛線)與「後來」結果標記(右側淡紫底 + 決策棒收盤點線 + 最後一根收盤圓點);其餘標註只在展開後的圖上 */
    var dd = clamp(T.d, 0, n - 1), xd = Math.round(X(dd) + slot / 2) + 0.5;

    for (var i = 0; i < n; i++) {
      var r = R[i], col = r[3] >= r[0] ? C.up : C.down, cx = Math.round(X(i)) + 0.5;
      g.strokeStyle = col; g.beginPath(); g.moveTo(cx, Y(r[1])); g.lineTo(cx, Y(r[2])); g.stroke();
      g.fillStyle = col; g.fillRect(cx - bw / 2, Math.min(Y(r[0]), Y(r[3])), bw, Math.max(1, Math.abs(Y(r[3]) - Y(r[0]))));
    }
    if (dd < n - 1) {
      var yc = Math.round(Y(R[dd][3])) + 0.5, xe = X(n - 1), ye = Y(R[n - 1][3]);
      g.strokeStyle = C.rout; g.lineWidth = 1.2; g.setLineDash([2, 2]); g.beginPath(); g.moveTo(xd, yc); g.lineTo(xe, yc); g.stroke(); g.setLineDash([]);

    g.strokeStyle = C.rjudge; g.lineWidth = 1.3; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(xd, 1); g.lineTo(xd, H - 1); g.stroke(); g.setLineDash([]); g.lineWidth = 1;

  }
